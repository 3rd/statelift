services:
  benchmark:
    build: .
    init: true
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ../lib:/statelift:ro
      - ./keyed/react-statelift:/react-statelift:ro
      - "${RUN_DIRECTORY:?RUN_DIRECTORY is required}:/results"
    environment:
      BENCHMARKS: "${BENCHMARKS:-}"
    shm_size: 4gb
    security_opt:
      - seccomp:unconfined
